upstream munara_backend {
    server unix:/run/munara/gunicorn.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name kutbilim.gps.gov.kg;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kutbilim.gps.gov.kg;

    ssl_certificate /etc/ssl/munara/fullchain.pem;
    ssl_certificate_key /etc/ssl/munara/kutbilim.gps.gov.kg.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 100m;

    root /opt/munara/current/frontend/dist;
    index index.html;

    location /static/ {
        alias /opt/munara/current/backend/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /opt/munara/current/backend/media/;
        expires 1h;
    }

    location /api/ {
        proxy_pass http://munara_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /admin/ {
        proxy_pass http://munara_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
